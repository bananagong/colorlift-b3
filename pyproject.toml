[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catlab-robosuite-assets"
version = "0.3.0"
description = "Reusable MuJoCo and robosuite assets for catlab robotics experiments"
requires-python = ">=3.10"
dependencies = ["robosuite>=1.5.2,<1.6", "mujoco>=3.3.0,<3.10", "numpy>=1.26,<2"]

[tool.setuptools.packages.find]
include = ["catlab_assets*", "lift_act*", "colorlift*"]

[tool.setuptools.package-data]
catlab_assets = ["assets/objects/*.xml"]
lift_act = ["protocol.json"]
